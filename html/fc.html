<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="color: rgb(141, 8, 26);">
        <h1 style="text-shadow: 3px 2px black; font-size: 60px; text-align: center;">Fale Conosco!</h1><p>Tem dúvidas sobre o Canadá? Entre em contato conosco!</p>
        <fieldset style="border: 2px solid black;">
        <h2 style="color:rgb(161, 10, 23); font-size: 20px;"></h2>
    <form>
    <label for="Nome:">Nome Completo:</label> <br>
    <input type="text"id="Nome" name="Nome"required><br><br>
    <label for="email">E-mail:</label><br>
    <input type="email"id="email"name="email"required><br><br>
    <label for="telefone">Telefone:</label><br>
    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"required><br><br>
    <label for="cidade">Cidade:</label><br><br>
    <input type="text"id="cidade"name="cidade"required><br><br>
           
<label for="assunto">Assunto:</label><br>
<select id="assunto"name="assunto">
<option>Turismo</option>
<option>Cultura</option>
<option>Pontos Turísticos</option>
<option>Outros</option>
</select><br><br>

<label for="mensagem">Mensagem:</label><br>
<textarea id="mensagem"name="mensagem"rows="5"required></textarea><br><br>
<button type="submit">Enviar mensagem</button>
</form>
            



</body>
</html>
